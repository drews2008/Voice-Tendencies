<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sideline Tendencies — ALPAUGH PLAYOFFS</title>
<style>
:root{--bg:#edf3ea;--card:#fffdf8;--ink:#12251a;--mute:#5d7568;--line:#cddbc0;--acc:#173a2d;--accink:#f4d063;--run:#c35a31;--pass:#2e6f9d;--warn:#fff1c2;--warnink:#5a4300;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a14;--card:#16251d;--ink:#e9f1ea;--mute:#9db3a5;--line:#2b4235;--acc:#f4d063;--accink:#12251a;--warn:#3a3114;--warnink:#f4e3a0}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:600px;margin:0 auto;padding:14px 14px 56px}
h1{font:700 24px 'Barlow Condensed',system-ui,sans-serif;margin:0 0 10px;letter-spacing:.02em}
h1 small{font:500 13px system-ui,sans-serif;color:var(--mute);letter-spacing:0;margin-left:6px}
button{font-family:inherit;cursor:pointer;min-height:48px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-weight:600;font-size:16px;padding:8px 12px}
button.go{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.row,.grp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.row button{flex:1 1 110px}.grp button{flex:1 1 70px}
#q{width:100%;font:600 22px Barlow,system-ui,sans-serif;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);margin:2px 0 6px}
#heard{min-height:22px;color:var(--mute);font-size:15px;margin:2px 0 8px}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sel label{flex:1 1 130px;font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.sel select,.sel input{min-height:44px;font:600 16px system-ui,sans-serif;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:6px 8px;width:100%}
.sum{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:14px;margin:10px 0 12px}
.sum p{margin:0;font-size:20px;line-height:1.45}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.hd b{font:700 21px 'Barlow Condensed',system-ui,sans-serif}.n{color:var(--mute);font-size:13px;text-align:right}
.bar{display:flex;height:34px;border-radius:6px;overflow:hidden;font:700 17px/34px 'Barlow Condensed',system-ui,sans-serif;color:#fff}
.bar span{padding-left:8px;white-space:nowrap;overflow:hidden}.r{background:var(--run)}.p{background:var(--pass)}
.rw{margin-top:7px;font-size:15px}.rw i{font-style:normal;color:var(--mute)}
.warn{background:var(--warn);color:var(--warnink);border-radius:6px;padding:7px 10px;margin:8px 0;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{min-height:40px;font-size:14px;padding:4px 10px}
details{margin-top:8px}summary{cursor:pointer;color:var(--mute);font-size:14px;min-height:32px}
.pl{font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.lst{margin:6px 0 0;padding-left:0;list-style:none;font-size:15px}.lst li{margin:4px 0}.lst button{width:100%;min-height:40px;text-align:left;font-size:15px;padding:6px 10px;border-left:8px solid var(--line)}.lst .kr{border-left-color:var(--run)}.lst .kp{border-left-color:var(--pass)}.lst .km{border-left-color:var(--mute)}.lst small{color:var(--mute)}
.foot{color:var(--mute);font-size:12px;margin-top:18px}
ul.t{margin:6px 0 0;padding-left:18px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const fk=f=>f.r>=70?'kr':f.r<=30?'kp':'km';
const needsDist=o=>o.down>=2&&!o.goal&&!o.fp&&!o.pt&&o.dist==null;

/* ---------- raw-log engine ---------- */
function rng(d,y){
  if(y==null)return null;
  if(d===1)return y>=10?[10,99]:[1,9];
  if(d===2)return y<=3?[1,3]:y<=7?[4,7]:[8,99];
  if(d===3)return y<=3?[1,3]:y<=6?[4,6]:y<=9?[7,9]:[10,99];
  return y<=3?[1,3]:[4,99];
}
function filt(o,skip){
  const r=o.down?rng(o.down,o.dist):null,sit=o.down||o.fp||o.goal;
  return LOG.filter(x=>{
    if(o.pt){if(x.dn!=='2PT')return false}
    else if(o.fp){if(!x.ds)return false}
    else if(o.down){if(x.dn!==o.down||!!x.gl!==!!o.goal)return false;if(r&&!skip.has('dist')&&(x.di==null||x.di<r[0]||x.di>r[1]))return false}
    else if(o.goal&&!x.gl)return false;
    if(x.dn==='2PT'&&sit)return false;
    if(o.hash&&!skip.has('hash')&&x.hs!==o.hash)return false;
    if(o.form&&!skip.has('form')&&x.form.toLowerCase()!==o.form.name.toLowerCase())return false;
    if(o.play&&!skip.has('play')&&x.cc!==o.play)return false;
    if(o.mo!=null&&!skip.has('mo')&&x.mo!==o.mo)return false;
    if(o.zone&&!skip.has('zone')&&x.zn!==o.zone)return false;
    if(o.sc&&!skip.has('sc')){const c=Math.abs(x.sd)<=14;if(o.sc==='close'?!c:c)return false}
    return true;
  });
}
function stats(rows){
  const pl=rows.filter(x=>x.pt==='Run'||x.pt==='Pass'),n=pl.length,run=pl.filter(x=>x.pt==='Run').length;
  const dir={L:0,R:0,M:0},calls={};
  pl.forEach(x=>{if(x.dir)dir[x.dir]++;const c=x.cc||'(not labeled)';calls[c]=(calls[c]||0)+1});
  const ys=pl.filter(x=>x.yds!=null&&!/penalty/i.test(x.out)).map(x=>x.yds).sort((a,b)=>a-b);
  const med=ys.length?(ys.length%2?ys[(ys.length-1)/2]:(ys[ys.length/2-1]+ys[ys.length/2])/2):null;
  return{n,rows:pl,run:n?Math.round(1000*run/n)/10:0,pass:n?Math.round(1000*(n-run)/n)/10:0,dir,
    calls:Object.entries(calls).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])),med,exp:ys.filter(y=>y>=15).length};
}

/* ---------- coach keys (edit these lines to change your notes) ---------- */
const COACH_NOTES=[];
const QBC=['QB KEEPER','QB SNEAK','QB DRAW','QB SWEEP'];
const isQB=x=>QBC.includes(x.cc);
function noteFor(f){return f?COACH_NOTES.find(n=>n.forms.some(x=>x.toLowerCase()===f.name.toLowerCase())):null}
function noteData(f){
  const n=noteFor(f);if(!n||!n.watch)return null;
  const rows=LOG.filter(x=>x.pt&&x.form.toLowerCase()===f.name.toLowerCase()),hit=rows.filter(x=>x.cc===n.watch).length;
  const calls=stats(rows).calls,max=calls.length?calls[0][1]:0,pct=rows.length?Math.round(100*hit/rows.length):0;
  const extra=hit<max?`<div class="rw"><i>Charted top call here is ${esc(calls[0][0])} (${calls[0][1]}).</i></div>`:'';
  const small=rows.length<5?warn('Only '+rows.length+' snap'+(rows.length==1?'':'s')+' charted in '+esc(f.name)+'. Your key stands; the data cannot confirm it yet.'):'';
  return{line:n.label+': watch for '+n.watch,
    say:n.label+': watch for '+n.watch+'. '+hit+' of '+rows.length+' charted snaps.',
    html:`<section class="card"><div class="hd"><b>Your key</b><span class="n">${esc(n.label)} · charted as ${esc(f.name)}</span></div><div class="rw"><b>Watch for ${esc(n.watch)}</b></div><div class="rw"><i>Data:</i> ${esc(n.watch)} on ${hit} of ${rows.length} snaps in ${esc(f.name)} (${pct}%).</div>${extra}${small}</section>`};
}
function spreadRead(o){
  const fn=o.form.name,rows=LOG.filter(x=>x.form===fn&&(x.pt==='Run'||x.pt==='Pass'));
  const G=[['1st down',x=>x.dn===1],['2nd down',x=>x.dn===2],['3rd and 4th down',x=>x.dn===3||x.dn===4]];
  const cur=o.down?(o.down===1?0:o.down===2?1:2):-1;
  const gs=G.map(([lab,f],i)=>{const r=rows.filter(f),run=r.filter(x=>x.pt==='Run').length;return{lab,r,run,ps:r.length-run,i}});
  const list=g=>g.r.map(x=>ORD[x.dn]+' & '+(x.gl?'goal':x.di)+' '+esc(x.cc||'(not labeled)')+' ('+x.pt.toLowerCase()+')').join(' · ');
  const tr=rows.filter(x=>x.pt==='Run').length;
  const html=`<section class="card"><div class="hd"><b>${esc(fn)}: mixed, read the situation</b><span class="n">${rows.length} snaps · ${tr} run, ${rows.length-tr} pass</span></div>`+
    gs.map(g=>`<div class="rw"${g.i===cur?' style="font-weight:700"':''}><i>${g.lab}:</i> ${g.run} run, ${g.ps} pass${g.r.length?' — '+list(g):''}</div>`).join('')+
    warn('Only '+rows.length+' '+esc(fn)+' snaps. Read the down as a lean, not a rule.')+'</section>';
  const g=cur>=0?gs[cur]:null;
  const say=g?(g.r.length?fn+' is mixed. On '+g.lab+': '+g.run+' run, '+g.ps+' pass in '+g.r.length+' snaps.':fn+' is mixed. No '+fn+' snaps on that down.'):fn+' is mixed, '+tr+' run and '+(rows.length-tr)+' pass. Give me the down and distance.';
  return{html,line:fn+': mixed, read the situation',say};
}
function qbData(){
  const pl=LOG.filter(x=>x.pt),nc=pl.filter(x=>x.pt==='Run'&&!x.cc).length,q=pl.filter(isQB),base=Math.round(1000*q.length/pl.length)/10;
  const sit=x=>{if(x.dn==='2PT')return null;if(x.gl)return'Goal-to-go';
    if(x.dn===2)return x.di>=10?'2nd & 10+':x.di>=4?'2nd & 4-9':'2nd & 1-3';
    if(x.dn===3)return x.di>=10?'3rd & 10+':x.di>=4?'3rd & 4-9':'3rd & 1-3';return null};
  const G=[x=>x.form,x=>x.pers?'Personnel '+x.pers:null,x=>x.dn==='2PT'?null:ORD[x.dn]+' down',x=>x.dn==='2PT'?null:(x.mo?'With motion':'No motion'),sit];
  const rows=[];
  G.forEach(f=>{const m={};pl.forEach(x=>{const k=f(x);if(k)(m[k]=m[k]||[]).push(x)});
    Object.entries(m).forEach(([k,r])=>{if(r.length>=3){const c=r.filter(isQB).length;rows.push({k,n:r.length,c,rate:Math.round(1000*c/r.length)/10})}})});
  const up=rows.filter(r=>r.rate>=base*1.3).sort((a,b)=>b.rate-a.rate||b.n-a.n),dn=rows.filter(r=>r.rate<=base*0.5).sort((a,b)=>a.rate-b.rate||b.n-a.n);
  const li=a=>a.length?'<ul class="t">'+a.map(r=>`<li><b>${esc(r.k)}</b>: ${r.c} of ${r.n} (${r.rate}%)</li>`).join('')+'</ul>':'<div class="rw">None.</div>';
  const dirs=QBC.map(c=>{const s=stats(pl.filter(x=>x.cc===c));return s.n>=2?esc(c)+' ('+s.n+'): '+dirStr(s.dir,true):null}).filter(Boolean);
  const html=`<section class="card"><div class="hd"><b>QB run indicators</b><span class="n">${q.length} of ${pl.length} snaps · ${base}%</span></div>
<div class="rw"><i>Raises the odds (1.3x or more, 3+ snaps):</i></div>${li(up)}
<div class="rw"><i>Lowers the odds (half the base or less):</i></div>${li(dn)}
<div class="rw"><i>Where they go:</i> ${dirs.join(' · ')}</div>
${warn('QB runs here are keeper, sneak, draw and sweep. Every cell is small.'+(nc?' '+nc+' run'+(nc==1?'':'s')+' with no charted call '+(nc==1?'is':'are')+' not counted.':''))}</section>`;
  const say='QB runs are '+base+'% of snaps. More likely: '+up.slice(0,5).map(r=>r.k).join(', ').replace(/ & /g,' and ')+'. Less likely: '+dn.slice(0,4).map(r=>r.k).join(', ').replace(/ & /g,' and ')+'.';
  return{html,say};
}

/* ---------- rendering ---------- */
function dirStr(d,cnt){
  const t=cnt?d.R+d.L+d.M:1;if(cnt&&!t)return'none logged';
  const o=['R','L','M'].filter(k=>d[k]!=null).map(k=>(cnt?Math.round(1000*d[k]/t)/10:d[k])+'% '+HW[k]);
  return o.length?o.join(' · '):'none logged';
}
const fromSheet=r=>({n:r.n,run:r.r,pass:r.p,dir:dirStr(r.d,false),calls:r.calls});
const fromStats=s=>{const q=s.rows.filter(isQB).length;return{n:s.n,run:s.run,pass:s.pass,dir:dirStr(s.dir,true),calls:s.calls,
  extra:(s.n?'QB runs: '+q+' of '+s.n+' ('+Math.round(100*q/s.n)+'%). ':'')+(s.med==null?'':'Median '+s.med+' yds · '+s.exp+' play'+(s.exp==1?'':'s')+' of 15+ yds')}};
const warn=t=>`<div class="warn">${t}</div>`;
function card(title,sub,r,note){
  const top=r.calls.slice(0,7).map(c=>esc(c[0])+' ('+c[1]+')').join(', ')||'none';
  return `<section class="card"><div class="hd"><b>${esc(title)}</b><span class="n">${esc(sub)}</span></div>
<div class="bar" role="img" aria-label="${r.run}% run, ${r.pass}% pass"><span class="r" style="width:${r.run}%">${r.run>=22?r.run+'% run':''}</span><span class="p" style="width:${r.pass}%">${r.pass>=22?r.pass+'% pass':''}</span></div>
<div class="rw"><i>Run / pass:</i> ${r.run}% / ${r.pass}%</div>
<div class="rw"><i>Direction:</i> ${r.dir}</div>
<div class="rw"><i>Calls:</i> ${top}</div>${r.extra?`<div class="rw"><i>${esc(r.extra)}</i></div>`:''}${r.n&&r.n<5?warn('Small sample: '+r.n+' play'+(r.n==1?'':'s')+'. Not a trend.'):''}${note||''}</section>`;
}
function relaxChips(o){
  const f=[['hash','hash',o.hash],['form','formation',o.form],['play','play',o.play],['dist','distance',o.dist],['mo','motion',o.mo],['zone','zone',o.zone],['sc','score',o.sc]];
  const c=f.filter(x=>x[2]!=null&&x[2]!=='').map(([k,l])=>[k,l,stats(filt(o,new Set([k]))).n]);
  if(!c.length)return'';
  return '<div class="chips">'+c.map(([k,l,n])=>`<button type="button" data-relax="${k}">Drop ${l}: ${n} plays</button>`).join('')+'</div>';
}
function playsList(st){
  if(!st.rows.length)return'';
  return `<details><summary>Plays (${st.rows.length})</summary>`+st.rows.slice(0,40).map(x=>{
    const sit=x.dn==='2PT'?'2PT':ORD[x.dn]+' & '+(x.gl?'G':(x.di==null?'?':x.di));
    return `<div class="pl">${x.g} · ${sit} · ${x.hs||'–'} · ${esc(x.form)} · <b>${esc(x.cc||'(not labeled)')}</b> → ${x.dir||'–'} · ${x.yds==null?'':(x.yds>0?'+':'')+x.yds} ${esc(x.out)}</div>`}).join('')+'</details>';
}
const GROUPS=[['Formation',x=>x.form],['Personnel',x=>x.pers?'Personnel '+x.pers:null],['Motion',x=>x.dn==='2PT'?null:(x.mo?'Motion':'No motion')],['Down',x=>x.dn==='2PT'?null:ORD[x.dn]+' down'],['Hash',x=>x.hs?HW[x.hs]+' hash':null],['Field',x=>x.zn||null],['Score',x=>x.dn==='2PT'?null:(Math.abs(x.sd)<=14?'Close game (within 14)':'Blowout (over 14)')]];
function tells(){
  const out=[];
  GROUPS.forEach(([g,f])=>{
    const m={};LOG.forEach(x=>{if(x.pt!=='Run'&&x.pt!=='Pass')return;const k=f(x);if(k)(m[k]=m[k]||[]).push(x)});
    Object.entries(m).forEach(([k,rows])=>{const s=stats(rows);if(s.n>=8&&Math.max(s.run,s.pass)>=80)out.push({g,k,s})});
  });
  return out.sort((a,b)=>b.s.n-a.s.n);
}
function listsCard(){
  const fl=FT.map((f,i)=>`<li><button type="button" class="${fk(f)}" data-pick="form:${i}"><b>${i+1}.</b> ${esc(f.name)} <small>(${f.n} snap${f.n==1?'':'s'} · ${f.r}% run)</small></button></li>`).join('');
  const pl=PL.map((p,i)=>`<li><button type="button" class="${p.k}" data-pick="play:${i}"><b>${i+1}.</b> ${esc(p.name)} <small>(${p.n})</small></button></li>`).join('');
  return `<section class="card"><div class="hd"><b>Lists</b><span class="n">tap one, or say "formation 2" / "play 5"</span></div>
<div class="rw"><i>Color:</i> <span style="color:var(--run)">■</span> run · <span style="color:var(--pass)">■</span> pass · <span style="color:var(--mute)">■</span> mixed (formations: 70%+ one way)</div>
<div class="rw"><b>Formations (${FT.length})</b></div><ol class="lst">${fl}</ol>
<div class="rw"><b>Plays (${PL.length})</b></div><ol class="lst">${pl}</ol></section>`;
}
function overview(){
  const sc=LOG.filter(x=>x.dn!=='2PT'),a=stats(sc),cl=stats(sc.filter(x=>Math.abs(x.sd)<=14)),bl=stats(sc.filter(x=>Math.abs(x.sd)>14));
  let h=card(TEAM+' overall','raw log · '+a.n+' scrimmage plays',fromStats(a));
  h+=`<section class="card"><div class="hd"><b>Game script</b><span class="n">read before trusting any run %</span></div>
<div class="rw"><i>Close (within 14):</i> ${cl.n} plays · ${cl.run}% run</div><div class="rw"><i>Blowout (over 14):</i> ${bl.n} plays · ${bl.run}% run</div>
${SCRIPT_WARN?warn(esc(SCRIPT_WARN)):''}</section>`;
  const t=tells();
  h+=`<section class="card"><div class="hd"><b>Tells</b><span class="n">8+ plays and 80%+ one way</span></div>`+
    (t.length?'<ul class="t">'+t.map(x=>`<li><b>${esc(x.k)}</b> (${esc(x.g)}): ${Math.max(x.s.run,x.s.pass)}% ${x.s.run>=x.s.pass?'run':'pass'}, ${x.s.n} plays · top ${esc(x.s.calls[0][0])}</li>`).join('')+'</ul>':'<div class="rw">None clear the bar.</div>')+'</section>';
  h=`<section class="card"><div class="hd"><b>Your keys</b><span class="n">edit COACH_NOTES in the file</span></div><ul class="t">`+(COACH_NOTES.length?'':'<li>No coach keys yet for '+esc(TEAM)+'.</li>')+COACH_NOTES.map(n=>`<li><b>${esc(n.label)}</b>: ${n.watch?'watch for '+esc(n.watch):'mixed, read the situation'}</li>`).join('')+`</ul></section>`+h;
  h+=listsCard();
  h+=qbData().html;
  h+=`<section class="card"><div class="hd"><b>Say it like this</b></div><div class="rw">"3 5 2" (down, distance, hash: 1 left, 2 middle, 3 right) · "first play" · "second and goal" · "two point" · then add ${FT.slice(0,3).map(f=>'"'+esc(f.name.toLowerCase().split(' ').map(w=>w==='l'?'left':w==='r'?'right':w).join(' '))+'"').join(', ')}, "motion", "red zone", "close game". Say "formation 2" or "play 5" to use a number from the lists. Say "qb run" for the QB indicators. Say a play by number ("play 3") or by name ("play crossbuck"). Fast digits like "352" work. Say "clear" to start over.</div></section>`;
  return h;
}
function render(){
  const o=S,res=$('res'),sum=$('sum');
  const sit=o.pt||o.fp||o.goal||o.down||o.hash||o.form||o.play||o.mo!=null||o.zone||o.sc;
  const any=sit||o.qb;
  $('heard').textContent=any?'Reading: '+human(o):'Pick a situation or just talk.';
  if(!any){sum.innerHTML='<p>'+esc(TEAM)+'. Pick a situation or say it.</p>';res.innerHTML=overview();lastSay='';return}
  if(o.qb&&!sit){const q=qbData();res.innerHTML=q.html;sum.innerHTML='<p>'+esc(q.say)+'</p>';lastSay=q.say;return}
  let h='',sheetR=null,noteLine='',noteSay='';
  const nd=noteData(o.form);
  if(nd){h+=nd.html;noteLine=nd.line;noteSay=nd.say}
  if(o.form&&(noteFor(o.form)||{}).mixed){const sp=spreadRead(o);h+=sp.html;noteLine=sp.line;noteSay=sp.say}
  if(o.qb)h+=qbData().html;
  const key=bucket(o);
  if(key&&(DD[key]||TH[key])){
    const th=TH[key]||{},dd=DD[key];let r=null,tag='',note='';
    if(o.hash){
      if(th[o.hash]){r=th[o.hash];tag=HW[o.hash]+' hash'}
      else if(th.M){r=th.M;tag='Middle stand-in';note=warn('No '+HW[o.hash]+' hash plays on the sheet for this spot. This is Middle, not '+HW[o.hash]+'.')}
    }
    if(o.down===1&&o.dist!=null&&o.dist!==10)note+=warn('Sheet bucket is 1st & 10 only. Check the log card below for 1st & '+o.dist+'.');
    if(r){sheetR=r;h+=card(LBL[key]+' · '+tag,'sheet · '+r.n+' plays',fromSheet(r),note)}
    if(dd){if(!sheetR)sheetR=dd;h+=card(LBL[key]+' · all hashes','sheet · '+dd.n+' plays',fromSheet(dd),r?'':note)}
  }
  if(o.hash&&!o.down&&!o.fp&&!o.pt&&!o.goal&&HT[o.hash]){const t=HT[o.hash];h+=card(HW[o.hash]+' hash overall','sheet · '+t.n+' plays',fromSheet(t),`<div class="rw"><i>Formations used:</i> ${esc(t.forms.join(', '))}</div>`)}
  if(o.form)h+=card(o.form.name+' · all situations','sheet · '+o.form.n+' plays',fromSheet(o.form));
  if(o.play){const pr=LOG.filter(x=>x.cc===o.play&&(x.pt==='Run'||x.pt==='Pass')),cnt=f=>{const m={};pr.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k,n])=>esc(k)+' ('+n+')').join(', ')||'none'};
    h+=`<section class="card"><div class="hd"><b>Play ${PL.findIndex(x=>x.name===o.play)+1}: ${esc(o.play)}</b><span class="n">log · ${pr.length} snap${pr.length==1?'':'s'} · all situations</span></div>
<div class="rw"><i>Formations:</i> ${cnt(x=>x.form)}</div><div class="rw"><i>Downs:</i> ${cnt(x=>x.dn==='2PT'?'2-point':x.gl?ORD[x.dn]+' & goal':ORD[x.dn]+' & '+x.di)}</div>
<div class="rw"><i>Hash:</i> ${cnt(x=>x.hs?HW[x.hs]:null)}</div><div class="rw"><i>Direction:</i> ${cnt(x=>x.dir?HW[x.dir]:null)}</div></section>`}
  const st=stats(filt(o,new Set()));
  h+=card('Raw log · '+human(o),'log · '+st.n+' plays',fromStats(st),(st.n?'':warn('No logged plays match every filter.'))+relaxChips(o))+playsList(st);
  res.innerHTML=h;
  const useLog=st.n>0||!sheetR||o.form||o.play||o.mo!=null||o.zone||o.sc;
  const src=useLog?{n:st.n,run:st.run,pass:st.pass,calls:st.calls}:{n:sheetR.n,run:sheetR.r,pass:sheetR.p,calls:sheetR.calls};
  const where=human(o);
  const pre=(!useLog&&src.n)?'No matching plays in the log. Sheet: ':'';
  const body=src.n?`${pre}<b>${src.run>=src.pass?src.run+'% run':src.pass+'% pass'}</b> over ${src.n} play${src.n==1?'':'s'}. Top call: <b>${esc(src.calls[0][0])}</b>${src.calls[1]&&src.calls[1][1]>=2?', then '+esc(src.calls[1][0]):''}.${src.n<5?' Small sample.':''}`:'No plays logged for that.';
  sum.innerHTML=(noteLine?`<p><b>${esc(noteLine)}</b></p>`:'')+`<p>${esc(where)}: ${body}</p>`;
  lastSay=((noteSay?noteSay+' ':'')+where+': '+body).replace(/<[^>]+>/g,'').replace(/ · /g,', ').replace(/ & /g,' and ').replace(/(\d+)-(\d+)/g,'$1 to $2').replace(/(\d+)\+/g,'$1 plus');
}

/* ---------- controls ---------- */
function setFrom(){$('q').value=speakText(S);refresh();render();window.GAME&&GAME.pushSoon()}
function buildControls(){
  const mk=(id,list)=>{const el=$(id);el.innerHTML='';list.forEach(([t,test,act])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.className='tog';b._t=test;b.addEventListener('click',()=>{act();setFrom()});el.appendChild(b)})};
  mk('gdn',[1,2,3,4].map(d=>[ORD[d],()=>S.down===d&&!S.fp&&!S.pt,()=>{const on=S.down===d&&!S.fp&&!S.pt;S.down=on?null:d;S.fp=S.pt=false;if(on)S.dist=null}]));
  mk('gfl',[
    ['1st play',()=>S.fp,()=>{S.fp=!S.fp;if(S.fp){S.down=null;S.dist=null;S.pt=false;S.goal=false}}],
    ['Goal-to-go',()=>S.goal,()=>{S.goal=!S.goal;if(S.goal){S.pt=false;S.fp=false}}],
    ['2-pt',()=>S.pt,()=>{S.pt=!S.pt;if(S.pt){S.down=null;S.dist=null;S.fp=false;S.goal=false}}],
    ['Motion',()=>S.mo===true,()=>{S.mo=S.mo===true?null:true}],
    ['No motion',()=>S.mo===false,()=>{S.mo=S.mo===false?null:false}],
    ['QB run',()=>S.qb,()=>{S.qb=!S.qb}]]);
  mk('ghs',[['L','L'],['M','M'],['R','R']].map(([t,k])=>[HW[k]+' hash',()=>S.hash===k,()=>{S.hash=S.hash===k?null:k}]));
  $('form').innerHTML='<option value="">Any</option>'+FT.map((f,i)=>`<option value="${i}">${i+1}. ${esc(f.name)} (${f.n})</option>`).join('');
  $('dist').addEventListener('input',e=>{S.dist=e.target.value?+e.target.value:null;$('q').value=speakText(S);render();window.GAME&&GAME.pushSoon()});
  $('form').addEventListener('change',e=>{S.form=e.target.value===''?null:FT[+e.target.value];setFrom()});
  $('play').innerHTML='<option value="">Any</option>'+PL.map((p,i)=>`<option value="${i}">${i+1}. ${esc(p.name)} (${p.n})</option>`).join('');
  $('play').addEventListener('change',e=>{S.play=e.target.value===''?null:PL[+e.target.value].name;setFrom()});
  $('sc').addEventListener('change',e=>{S.sc=e.target.value||null;setFrom()});
  $('zn').addEventListener('change',e=>{S.zone=e.target.value||null;setFrom()});
  $('res').addEventListener('click',e=>{const pb=e.target.closest&&e.target.closest('[data-pick]');if(pb){const [t,i]=pb.getAttribute('data-pick').split(':');S=blank();if(t==='form')S.form=FT[+i];else S.play=PL[+i].name;setFrom();window.scrollTo(0,0);return}const k=e.target.getAttribute&&e.target.getAttribute('data-relax');if(!k)return;S[k]=null;setFrom()});
  $('clr').addEventListener('click',()=>{S=blank();lastIncomplete=false;$('q').value='';refresh();render();window.GAME&&GAME.push('')});
}
function refresh(){
  document.querySelectorAll('.tog').forEach(b=>b.setAttribute('aria-pressed',String(!!b._t())));
  $('dist').value=S.dist==null?'':S.dist;
  $('form').value=S.form?String(FT.indexOf(S.form)):'';
  $('play').value=S.play?String(PL.findIndex(x=>x.name===S.play)):'';
  $('sc').value=S.sc||'';$('zn').value=S.zone||'';
}
function fromText(){if(window.GAME&&GAME.isNote&&GAME.isNote($('q').value))return;const p=parse($('q').value);p.sc=p.sc||S.sc;p.zone=p.zone||S.zone;S=p;lastIncomplete=false;refresh();render();window.GAME&&GAME.typing&&GAME.typing()}

/* ---------- voice ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,on=false,speaking=false,speakOn=false,wl=null;
try{speakOn=localStorage.getItem('sl.voice')==='1'}catch(e){}
function startRec(){if(!on||speaking||!rec)return;try{rec.start()}catch(e){}}
let utt=null,sayTok=0;
// returns true if it tried to speak. Reports to GAME.sound whether audio actually started.
function say(t){
  if(!speakOn||!window.speechSynthesis||!t)return false;
  const ss=window.speechSynthesis,tok=++sayTok;
  try{
    const busy=ss.speaking||ss.pending;if(busy)ss.cancel();
    speaking=true;try{rec&&rec.stop()}catch(e){}
    const u=new SpeechSynthesisUtterance(t);u.rate=1.05;u.lang='en-US';utt=u; // keep a reference: Chrome drops utterances that get garbage-collected
    let started=false;
    const done=ok=>{if(tok!==sayTok)return;speaking=false;utt=null;window.GAME&&GAME.sound&&GAME.sound(ok);startRec()};
    u.onstart=()=>{started=true;window.GAME&&GAME.sound&&GAME.sound(true)};
    u.onend=()=>done(true);
    u.onerror=e=>{if(e&&(e.error==='interrupted'||e.error==='canceled'))return;done(started)};
    // speaking right after cancel() is silently dropped on some phones; give it a beat
    setTimeout(()=>{if(tok!==sayTok)return;try{ss.resume();ss.speak(u)}catch(e){done(false)}},busy?150:0);
    setTimeout(()=>{if(tok===sayTok&&!started)done(false)},3000);
    return true;
  }catch(e){speaking=false;return false}
}
function onVoice(alts){
  alts=(Array.isArray(alts)?alts:[alts]).map(x=>String(x||'').trim()).filter(Boolean);if(!alts.length)return;
  if(window.GAME&&GAME.voice(alts))return; // "note ..." keyword
  if(alts.some(a=>/^(clear|clean|cleared|reset|start over)\b/i.test(a))){$('clr').click();$('heard').textContent='Heard: clear';say('Cleared.');return}
  // the phone sends up to 5 guesses; use the one that makes the most football sense
  let t=alts[0],bv=-99;
  alts.forEach(a=>{const v=score(parse(lastIncomplete?$('q').value+' '+a:a));if(v>bv){bv=v;t=a}});
  const p=parse(t),hasSit=p.down||p.fp||p.pt||p.goal,cur=S.down||S.fp||S.pt||S.goal;
  if(lastIncomplete){$('q').value=$('q').value+' '+t;const q=parse($('q').value);q.sc=q.sc||S.sc;q.zone=q.zone||S.zone;S=q}
  else if(!hasSit&&cur){['hash','form','play','mo','zone','sc','qb'].forEach(k=>{if(p[k]!=null&&p[k]!==false)S[k]=p[k]});$('q').value=speakText(S)}
  else{p.sc=p.sc||S.sc;p.zone=p.zone||S.zone;S=p;$('q').value=speakText(S)}
  lastIncomplete=needsDist(S);refresh();render();
  $('heard').textContent='Heard "'+t+'" → '+(human(S)||'nothing I recognize. Try "3 5 2".')+(t!==alts[0]?'  (phone first guessed "'+alts[0]+'")':'');
  const out=lastIncomplete?'Distance?':lastSay;say(out);window.GAME&&GAME.push(out);
}
$('mic').addEventListener('click',async()=>{
  if(!SR){$('heard').textContent='Voice input is not supported in this browser. Type it, or use the phone keyboard mic.';return}
  if(on){on=false;try{rec.stop()}catch(e){}$('mic').textContent='Start hands-free';try{wl&&wl.release()}catch(e){}wl=null;return}
  rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;
  // phones repeat or merge results in continuous mode; one phrase per session there, restarted automatically
  rec.continuous=!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){const r=e.results[i],a=[];for(let j=0;j<r.length;j++)a.push(r[j].transcript);onVoice(a)}};
  rec.onend=()=>{if(on&&!speaking)startRec()};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;$('mic').textContent='Start hands-free';$('heard').textContent='Mic blocked. Allow microphone access for this page.'}};
  on=true;$('mic').textContent='Stop listening';startRec();
  try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}
});
function setSpk(v){speakOn=v;try{localStorage.setItem('sl.voice',v?'1':'0')}catch(e){}$('spk').setAttribute('aria-pressed',String(speakOn));$('spk').textContent='Voice reply: '+(speakOn?'on':'off');window.GAME&&GAME.sound&&GAME.sound(null)}
$('spk').addEventListener('click',()=>{setSpk(!speakOn);if(speakOn)say('Voice on.');else if(window.speechSynthesis)speechSynthesis.cancel()}); // speaking once on the tap unlocks audio on iPad/iPhone
setSpk(speakOn);
$('q').addEventListener('input',fromText);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(window.GAME&&GAME.typed(e.target.value))return;e.target.blur();say(lastSay);window.GAME&&GAME.push(lastSay)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&on&&!wl&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})});

$('foot').textContent='Source: ALPAUGH PLAYOFFS SCOUTING sheet (Tendencies, Down & Distance, Hash Tendencies, Formation Tendencies tabs) plus the raw Game Log, '+LOG.length+' rows. Sheet down & distance buckets count goal-to-go plays only in the goal buckets, same as the raw log. 4th down has no lookup bucket here; the raw log card covers it.';
buildControls();refresh();render();
</script>
<script src="game.js?v=6"></script>
</body>
