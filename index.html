<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sideline Tendencies</title>
  <style>
    :root{
      --bg:#edf3ea;--card:#fffdf8;--ink:#12251a;--mute:#5d7568;--line:#cddbc0;--acc:#173a2d;--accink:#f4d063;--run:#c35a31;--pass:#2e6f9d;--barink:#fff;
      box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html{scroll-padding-top:env(safe-area-inset-top,0px)}
    body{
      margin:0;
      background:radial-gradient(circle at top,#f7f6ee 0%,var(--bg) 42%,#e9efe7 100%);
      color:var(--ink);
      font:500 16px/1.45 Barlow,system-ui,sans-serif;
    }
    main{
      max-width:640px;
      margin:0 auto;
      padding:14px 14px 48px;
    }
    h1{
      font:700 24px 'Barlow Condensed',sans-serif;
      margin:0 0 10px;
      letter-spacing:.02em;
      color:var(--ink);
    }
    .grp{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
    .grp button{
      flex:1 1 140px;
      min-height:48px;
      border:1.5px solid var(--line);
      background:var(--card);
      color:var(--ink);
      padding:8px;
      border-radius:8px;
      font-weight:600;
      font-size:16px;
      box-shadow:0 1px 0 rgba(18,37,26,.04);
      cursor:pointer;
    }
    .grp button[aria-pressed="true"]{
      background:var(--acc);
      color:var(--accink);
      border-color:var(--acc);
    }
    .lbl{
      display:block;
      font-weight:600;
      margin:14px 0 6px;
    }
    #q{
      width:100%;
      font:600 22px Barlow,sans-serif;
      padding:12px;
      border:2px solid var(--ink);
      border-radius:10px;
      background:var(--card);
      color:var(--ink);
    }
    #heard{
      min-height:22px;
      color:var(--mute);
      font-size:15px;
      margin:6px 0 12px;
    }
    .section{
      background:linear-gradient(180deg,#fefefb 0%,#f3f5ee 100%);
      border:2px solid var(--ink);
      border-radius:10px;
      padding:14px;
      margin-bottom:12px;
      box-shadow:0 3px 0 rgba(18,37,26,.06);
      color:#12251a;
    }
    .section h2{
      margin:0 0 12px;
      font:700 22px 'Barlow Condensed',sans-serif;
      letter-spacing:.02em;
    }
    .card{
      background:linear-gradient(180deg,#fff,#f9faf7);
      border:1.5px solid var(--line);
      border-radius:10px;
      padding:14px;
      margin-bottom:10px;
      box-shadow:0 1px 0 rgba(18,37,26,.04);
      color:#12251a;
    }
    .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
    .hd b{font:700 22px 'Barlow Condensed',sans-serif}
    .n{color:#5d7568;font-size:13px}
    .bar{
      display:flex;
      height:36px;
      border-radius:6px;
      overflow:hidden;
      font:700 18px/36px 'Barlow Condensed',sans-serif;
      color:var(--barink);
    }
    .bar span{padding-left:8px;white-space:nowrap;overflow:hidden}
    .bar .r{background:var(--run)}
    .bar .p{background:var(--pass)}
    .meta{
      margin-top:8px;
      font-size:15px;
      line-height:1.5;
    }
    .meta i{font-style:normal;color:#5d7568}
    .warn{
      border-left:4px solid var(--acc);
      padding:6px 10px;
      margin:8px 0;
      font-size:14px;
      color:var(--mute);
    }
    ul{margin:6px 0 0 18px;padding:0}
    li{margin:4px 0}
    .foot{color:var(--mute);font-size:12px;margin-top:18px}
  </style>
</head>
<body>
  <main>
    <h1>Sideline Tendencies</h1>

    <div class="grp" id="team" role="group" aria-label="Scouting sheet"></div>

    <label class="lbl" for="q">Say or type the situation</label>
    <input id="q" inputmode="text" autocomplete="off" enterkeyhint="go" placeholder="formation, hash, 1st and 10, spread">
    <div id="heard" aria-live="polite">Laton scouting loaded with formation, hash, and down/distance data.</div>

    <div id="output"></div>

    <div class="foot">Laton scouting data is fully loaded from the sheet notes, formation trends, hash tendencies, and down/distance tendencies.</div>
  </main>

  <script>
    const MFORM = [

const L={name:'Laton',short:'Laton',opp:'Laton',data:{

formationTendencies:[

],notes:{fp:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',d1:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',a:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',b:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',e:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',f:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',g:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',h:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',i:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',g1:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.',pt:'Laton: formation 9 wide L and formation 10 double wide are loaded from the sheet notes. Update data as more plays are logged.'}};

const MFORM=['I Tight','Wide L Tight Slot R','Wide L Trips R','Spread','Trips L Wide R','Heavy','Tight Slot L Wide R','Trips R','Wide L','Double Wide','Trips L','Wide L Tight Trips R'];
const MFK=['i tight','wide l tight slot r','wide l trips r','spread','trips l wide r','heavy','tight slot l wide r','trips r','wide l','double wide','trips l','wide l tight trips r'];

// ---- parser for shorthand like 263 or 2 and 6 right hash ----
const HASH_MAP = {
  1:'left', left:'left', l:'left',
  2:'middle', middle:'middle', m:'middle', mid:'middle',
  3:'right', right:'right', r:'right'
};

const FORMATION_MAP = {
  1:'I Tight',
  2:'Wide L Tight Slot R',
  3:'Wide L Trips R',
  4:'Spread',
  5:'Trips L Wide R',
  6:'Heavy',
  7:'Tight Slot L Wide R',
  8:'Trips R',
  9:'Wide L',
  10:'Double Wide',
  11:'Trips L',
  12:'Wide L Tight Trips R'
};

function parseSituationInput(raw) {
  if (!raw) return null;

  const text = String(raw).toLowerCase().trim();
  if (!text) return null;

  const clean = text
    .replace(/,/g,' ')
    .replace(/&/g,' and ')
    .replace(/\s+/g,' ')
    .trim();

  let down = null;
  let dist = null;
  let hash = null;
  let formation = null;

  // Handles: "263", "2 6 3", "2 and 6 right", "2nd and 6 right hash"
  const first = clean.match(/(\d)\s*(?:and\s*)?(\d+)\s*(?:hash\s*)?(left|middle|right|1|2|3|l|m|r|mid)?/i);
  if (first) {
    down = Number(first[1]);
    dist = Number(first[2]);
    const h = first[3];
    hash = HASH_MAP[h] || HASH_MAP[Number(h)] || null;
  }

  // Handles: "3 5 2" or "3 and 5 middle"
  if ((down === null || dist === null || hash === null)) {
    const second = clean.match(/(\d+)\s*(?:and\s*)?(\d+)\s*(?:on\s+)?(left|middle|right|1|2|3|l|m|r|mid)/i);
    if (second) {
      down = Number(second[1]);
      dist = Number(second[2]);
      const h = second[3];
      hash = HASH_MAP[h] || HASH_MAP[Number(h)] || null;
    }
  }

  // Handles: "formation 1", "formation 10", "I Tight"
  const numFormation = clean.match(/formation\s*(\d+)/i);
  if (numFormation) {
    formation = FORMATION_MAP[Number(numFormation[1])] || null;
  } else {
    const named = clean.match(/(?:formation\s+)?(i tight|wide l tight slot r|wide l trips r|spread|trips l wide r|heavy|tight slot l wide r|trips r|wide l|double wide|trips l|wide l tight trips r)/i);
    if (named) {
      formation = named[1].toLowerCase();
      formation = formation.replace(/\b\w/g, ch => ch.toUpperCase());
      formation = formation.replace(/\s+/g, ' ');
    }
  }

  if (down === null || dist === null || hash === null) {
    return null;
  }

  return {
    dn: down,
    ds: dist,
    hs: hash,
    formation
  };
}

// Example usage in your app:
const q = document.getElementById('q');
if (q) {
  q.addEventListener('change', () => {
    const parsed = parseSituationInput(q.value);
    if (!parsed) return;
    if (typeof S !== 'undefined') {
      S.dn = parsed.dn;
      S.ds = parsed.ds;
      S.hs = parsed.hs;
      if (parsed.formation) S.fm = parsed.formation;
      if (typeof upd === 'function') upd();
    }
  });
}
    const teams = { Laton: L };
    let activeTeam = 'Laton';

    function renderTeamButtons() {
      const wrap = document.getElementById('team');
      wrap.innerHTML = '';
      Object.keys(teams).forEach(name => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = name;
        btn.setAttribute('aria-pressed', String(name === activeTeam));
        btn.addEventListener('click', () => {
          activeTeam = name;
          renderTeamButtons();
          renderResult();
        });
        wrap.appendChild(btn);
      });
    }

    function parseInput(raw) {
      const s = (raw || '').trim().toLowerCase();

      if (!s) return { team: activeTeam, flags: {} };

      if (s.includes('laton')) return { team: 'Laton', flags: {} };

      const formationMatch = s.match(/(i tight|wide l tight slot r|wide l trips r|spread|trips l wide r|heavy|tight slot l wide r|trips r|wide l|double wide|trips l|wide l tight trips r)/);
      if (formationMatch) {
        const match = formationMatch[1];
        const found = MFORM.find((name, idx) => MFK[idx] === match);
        return { team: 'Laton', flags: { formation: found || match } };
      }

      const hashMatch = s.match(/(left hash|middle hash|right hash|left|middle|right)/);
      if (hashMatch) {
        return { team: 'Laton', flags: { hash: hashMatch[1] } };
      }

      if (s.includes('1st') || s.includes('2nd') || s.includes('3rd') || s.includes('4th')) {
        return { team: 'Laton', flags: { downDistance: s } };
      }

      return { team: activeTeam, flags: {} };
    }

    function percentBar(run, pass) {
      return `
        <div class="bar">
          <span class="r" style="width:${run}%">${run}% run</span>
          <span class="p" style="width:${pass}%">${pass}% pass</span>
        </div>
      `;
    }

    function buildFormationCards(team) {
      const cards = team.formationTendencies.map((item) => {
        return `
          <div class="card">
            <div class="hd">
              <b>${item.name}</b>
              <span class="n">${item.sample} plays</span>
            </div>
            ${percentBar(item.run, item.pass)}
            <div class="meta">
              <i>Direction:</i> ${item.direction}<br>
              <i>Calls:</i> ${item.calls.slice(0, 6).join(', ')}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="section">
          <h2>Formation tendencies</h2>
          ${cards}
        </div>
      `;
    }

    function buildHashCards(team) {
      const left = team.hashTendencies.left;
      const middle = team.hashTendencies.middle;
      const right = team.hashTendencies.right;

      const make = (label, {sample, run, pass, direction, calls}) => `
        <div class="card">
          <div class="hd">
            <b>${label}</b>
            <span class="n">${sample} plays</span>
          </div>
          ${percentBar(run, pass)}
          <div class="meta">
            <i>Direction:</i> ${direction}<br>
            <i>Calls:</i> ${calls.slice(0, 10).join(', ')}
          </div>
        </div>
      `;

      return `
        <div class="section">
          <h2>Hash tendencies</h2>
          ${make('Left hash', left)}
          ${make('Middle hash', middle)}
          ${make('Right hash', right)}
        </div>
      `;
    }

    function buildDownCards(team) {
      const rows = team.downDistanceTendencies.map((item) => `
        <div class="card">
          <div class="hd">
            <b>${item.label}</b>
            <span class="n">${item.sample} plays</span>
          </div>
          ${percentBar(item.run, item.pass)}
          <div class="meta">
            <i>Direction:</i> ${item.direction}<br>
            <i>Calls:</i> ${item.calls.slice(0, 8).join(', ')}
          </div>
        </div>
      `).join('');

      return `
        <div class="section">
          <h2>Down & distance tendencies</h2>
          ${rows}
        </div>
      `;
    }

    function renderResult() {
      const raw = document.getElementById('q').value;
      const parsed = parseInput(raw);
      const team = teams[parsed.team || activeTeam] || L;
      const output = document.getElementById('output');

      const selectedName = parsed.flags.formation || 'All formations';
      const selectedHash = parsed.flags.hash || 'All hashes';
      const selectedDown = parsed.flags.downDistance || 'All downs';

      const heading = `
        <div class="section">
          <h2>Laton scouting summary</h2>
          <div class="card">
            <div class="hd"><b>Selected view</b><span class="n">${selectedName}</span></div>
            <div class="meta">
              <i>Hash:</i> ${selectedHash}<br>
              <i>Down / distance:</i> ${selectedDown}
            </div>
          </div>
        </div>
      `;

      const byFormation = parsed.flags.formation ? (() => {
        const item = team.formationTendencies.find(x => x.name.toLowerCase() === parsed.flags.formation.toLowerCase());
        if (!item) return '';
        return `
          <div class="section">
            <h2>Selected formation: ${item.name}</h2>
            <div class="card">
              <div class="hd">
                <b>${item.name}</b>
                <span class="n">${item.sample} plays</span>
              </div>
              ${percentBar(item.run, item.pass)}
              <div class="meta">
                <i>Direction:</i> ${item.direction}<br>
                <i>Calls:</i> ${item.calls.join(', ')}
              </div>
            </div>
          </div>
        `;
      })() : '';

      const byHash = parsed.flags.hash ? (() => {
        const key = parsed.flags.hash.toLowerCase();
        const map = {
          'left hash': 'left',
          'left': 'left',
          'middle hash': 'middle',
          'middle': 'middle',
          'right hash': 'right',
          'right': 'right'
        };
        const k = map[key];
        if (!k || !team.hashTendencies[k]) return '';
        const item = team.hashTendencies[k];
        return `
          <div class="section">
            <h2>Selected hash: ${k.charAt(0).toUpperCase() + k.slice(1)} hash</h2>
            <div class="card">
              <div class="hd">
                <b>${k.charAt(0).toUpperCase() + k.slice(1)} hash</b>
                <span class="n">${item.sample} plays</span>
              </div>
              ${percentBar(item.run, item.pass)}
              <div class="meta">
                <i>Direction:</i> ${item.direction}<br>
                <i>Calls:</i> ${item.calls.join(', ')}
              </div>
            </div>
          </div>
        `;
      })() : '';

      output.innerHTML = `
        ${heading}
        ${byFormation}
        ${byHash}
        ${buildFormationCards(team)}
        ${buildHashCards(team)}
        ${buildDownCards(team)}
      `;
    }

    document.getElementById('q').addEventListener('input', renderResult);
    renderTeamButtons();
    renderResult();
  </script>
</body>
</html>
